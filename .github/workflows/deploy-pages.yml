name: Deploy web app to GitHub Pages

# Runs only for pushes to main (never for pull requests) after the full verification passes.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg xvfb
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run format:check && npm run lint && npm run typecheck && npm run scan:secrets
      - run: npm test
      - name: Build with the repository base path
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - run: cp apps/web/dist/index.html apps/web/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
